<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Link Your Microsoft Account</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet" />
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-body p-4">
                        <div class="text-center mb-4">
                            <h4 class="card-title">Link Microsoft Account</h4>
                            <p class="text-muted small">This Microsoft account is not yet linked to an existing Goal Tracker user. Enter the credentials for the user account you want to sign into.</p>
                        </div>

                        <div id="linkAlert"></div>
                        <form id="linkForm">
                            <div class="mb-3">
                                <label for="linkEmail" class="form-label">Email Address</label>
                                <input type="email" id="linkEmail" class="form-control" required autocomplete="username" />
                            </div>
                            <div class="mb-3">
                                <label for="linkPassword" class="form-label">Password</label>
                                <input type="password" id="linkPassword" class="form-control" required autocomplete="current-password" />
                            </div>
                            <div class="form-check mb-3">
                                <input class="form-check-input" type="checkbox" id="linkRememberMe" />
                                <label class="form-check-label" for="linkRememberMe">Keep me signed in</label>
                            </div>
                            <button id="linkSubmitButton" type="button" class="btn btn-primary w-100">Link and Sign In</button>
                        </form>
                        <div class="text-center mt-3">
                            <a href="login.html" class="text-decoration-none">Back to normal login</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const PAYLOAD_KEY = "microsoftLinkPayload";
        const payload = JSON.parse(sessionStorage.getItem(PAYLOAD_KEY) || "null");

        const linkAlert = document.getElementById("linkAlert");
        const linkEmail = document.getElementById("linkEmail");
        const linkPassword = document.getElementById("linkPassword");
        const linkRememberMe = document.getElementById("linkRememberMe");
        const linkSubmitButton = document.getElementById("linkSubmitButton");

        function showAlert(type, message) {
            linkAlert.innerHTML = `<div class="alert alert-${type} alert-dismissible fade show" role="alert">${message}</div>`;
        }

        function persistAndRedirect(data, rememberMe = false) {
            const userPayload = data.user;
            userPayload.token = data.token;
            const userData = JSON.stringify(userPayload);
            if (rememberMe) localStorage.setItem("user", userData);
            else sessionStorage.setItem("user", userData);
            sessionStorage.removeItem(PAYLOAD_KEY);
            window.location.href = { employee: "employee.html", manager: "manager.html", admin: "admin.html" }[data.user.role] || "login.html";
        }

        if (!payload || !payload.idToken) {
            showAlert("danger", "No Microsoft login data was found. Please retry from the login page.");
            linkSubmitButton.disabled = true;
        } else {
            if (payload.email) {
                linkEmail.value = payload.email;
            }
        }

        linkSubmitButton.addEventListener("click", async () => {
            const email = linkEmail.value.trim();
            const password = linkPassword.value;
            const rememberMe = linkRememberMe.checked;

            if (!email || !password) {
                showAlert("warning", "Please enter both email and password.");
                return;
            }

            linkSubmitButton.disabled = true;
            linkSubmitButton.textContent = "Linking...";
            linkAlert.innerHTML = "";

            try {
                const response = await fetch("http://localhost:5000/api/auth/microsoft/link", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({
                        idToken: payload.idToken,
                        accessToken: payload.accessToken,
                        email,
                        password
                    }),
                    signal: AbortSignal.timeout(30000)
                });
                const data = await response.json();
                if (!response.ok) {
                    throw new Error(data.message || "Failed to link Microsoft account.");
                }

                persistAndRedirect(data, rememberMe);
            } catch (error) {
                showAlert("danger", error.message || "Unable to link the Microsoft account.");
            } finally {
                linkSubmitButton.disabled = false;
                linkSubmitButton.textContent = "Link and Sign In";
            }
        });
    </script>
</body>
</html>
